<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Data Review</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --del: #ffd7d5; --ins: #d4f5dc; --warn: #b25000; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #f2f2f7; --muted: #98989d; --line: #3a3a3c; --del: #5c2a27; --ins: #1f4d2b; --warn: #ff9f40; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  select, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  #pick { width: 100%; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  audio { flex: 1; min-width: 240px; height: 36px; }
  .muted { font-size: 13px; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  .box { white-space: pre-wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; }
  del { background: var(--del); text-decoration: line-through; }
  ins { background: var(--ins); text-decoration: none; }
  .dropped { color: var(--warn); font-weight: 600; }
  label { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="bar">
    <label>Show <select id="filter">
      <option value="all">all</option><option value="train">train</option><option value="val">val</option><option value="dropped">dropped</option>
    </select></label>
    <label>Sort <select id="sort">
      <option value="mismatch">biggest mismatch first</option><option value="time">by time</option>
    </select></label>
    <span class="muted" id="totals"></span>
  </div>
  <select id="pick"></select>
  <div class="bar">
    <audio id="audio" controls preload="none"></audio>
    <select id="speed" title="Playback speed (doesn't change the file)">
      <option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option>
    </select>
  </div>
  <div class="bar">
    <button id="prev">← Prev</button>
    <button id="next">Next →</button>
    <span class="muted" id="pos"></span>
    <button id="drop" style="margin-left:auto">Drop from training</button>
  </div>
  <div class="muted" id="meta"></div>

  <h2>Training label</h2>
  <div class="box" id="label"></div>
  <h2>Label vs what the stock model heard</h2>
  <div class="box" id="diff"></div>
  <h2>Your transcript</h2>
  <div class="box" id="source"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let all = [], view = [], cur = null;

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function wordDiff(a, b) {
  const A = a.split(/\s+/).filter(Boolean), B = b.split(/\s+/).filter(Boolean);
  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  const k = w => w.toLowerCase().replace(/[^a-z0-9']/g, "");
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = k(A[i]) === k(B[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (k(A[i]) === k(B[j])) { out.push(esc(A[i])); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push(`<del>${esc(A[i++])}</del>`);
    else out.push(`<ins>${esc(B[j++])}</ins>`);
  }
  while (i < n) out.push(`<del>${esc(A[i++])}</del>`);
  while (j < m) out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(" ");
}

function itemLabel(r) {
  const [d, t] = [r.clip.slice(5, 10), r.clip.slice(11)];
  const when = `${d} ${t.slice(0, 2)}:${t.slice(2, 4)}:${t.slice(4)}`;
  const piece = r.piece ? ` · piece ${r.piece}` : "";
  return `${r.dropped ? "✕ " : ""}${Math.round(r.mismatch * 100)}% · ${r.split} · ${when}${piece} · ${r.duration.toFixed(1)}s · ${r.text.slice(0, 70)}`;
}

function rebuild(keepItem) {
  const f = $("filter").value;
  view = all.filter(r => f === "all" || (f === "dropped" ? r.dropped : r.split === f));
  view.sort($("sort").value === "mismatch" ? (a, b) => b.mismatch - a.mismatch : (a, b) => a.item.localeCompare(b.item));
  $("pick").innerHTML = view.map((r, i) => `<option value="${i}">${esc(itemLabel(r))}</option>`).join("");
  const mins = s => (all.filter(s).reduce((t, r) => t + r.duration, 0) / 60).toFixed(1);
  $("totals").textContent = `train ${mins(r => r.split === "train" && !r.dropped)} min · val ${mins(r => r.split === "val" && !r.dropped)} min · dropped ${all.filter(r => r.dropped).length}`;
  const i = Math.max(0, view.findIndex(r => r.item === keepItem));
  if (view.length) show(i);
}

function show(i) {
  $("pick").selectedIndex = i;
  cur = view[i];
  $("audio").src = "/audio?item=" + encodeURIComponent(cur.item);
  $("audio").playbackRate = +$("speed").value;
  $("pos").textContent = `${i + 1} of ${view.length}`;
  $("prev").disabled = i <= 0; $("next").disabled = i >= view.length - 1;
  $("meta").innerHTML = `${cur.split} · ${cur.duration.toFixed(1)}s · mismatch ${Math.round(cur.mismatch * 100)}%` +
    (cur.dropped ? ` · <span class="dropped">dropped</span>` : "");
  $("drop").textContent = cur.dropped ? "Keep in training" : "Drop from training";
  $("label").textContent = cur.text;
  $("diff").innerHTML = wordDiff(cur.text, cur.heard || "") || "<span class=muted>Same words.</span>";
  $("source").innerHTML = cur.source ? esc(cur.source)
    : `<span class="muted">Piece ${cur.piece} of a longer dictation (${cur.clip}). Full transcript is in the review tool.</span>`;
}

$("diff").title = "struck = in your label only, highlighted = heard by the stock model only";
$("filter").onchange = () => rebuild(cur && cur.item);
$("sort").onchange = () => rebuild(cur && cur.item);
$("pick").onchange = e => show(+e.target.value);
$("prev").onclick = () => show($("pick").selectedIndex - 1);
$("next").onclick = () => show($("pick").selectedIndex + 1);
$("drop").onclick = async () => {
  cur.dropped = !cur.dropped;
  await fetch("/api/drop", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ item: cur.item, drop: cur.dropped }) });
  rebuild(cur.item);
};
try { $("speed").value = localStorage.getItem("speed") || "1"; } catch {}
$("speed").onchange = () => {
  $("audio").playbackRate = +$("speed").value;
  try { localStorage.setItem("speed", $("speed").value); } catch {}
};
$("audio").onloadedmetadata = () => { $("audio").playbackRate = +$("speed").value; };
fetch("/api/items").then(r => r.json()).then(d => { all = d; rebuild(); });
</script>
</body>
</html>
